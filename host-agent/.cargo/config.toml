# Cross-compilation targets for ARM-based systems.
#
# Prerequisites (Debian/Ubuntu):
#   sudo apt install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
#
# Note: these GNU targets inherit the glibc version from the sysroot used at build time.
# If you need binaries compatible with glibc 2.31-13, build from a Debian 11 / bullseye
# sysroot or matching container image.
#
# Add rustup targets once:
#   rustup target add aarch64-unknown-linux-gnu
#   rustup target add armv7-unknown-linux-gnueabihf
#
# Build commands:
#   cargo build --release --target aarch64-unknown-linux-gnu
#   cargo build --release --target armv7-unknown-linux-gnueabihf

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.armv7-unknown-linux-musleabihf]
linker = "arm-linux-musleabihf-gcc"
