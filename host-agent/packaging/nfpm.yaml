name: sadapp-host-agent
arch: __NFPM_ARCH__
platform: linux
version: __NFPM_VERSION__
release: __NFPM_RELEASE__
section: admin
priority: optional
maintainer: SadApp <support@sadapp.org>
description: SadApp host monitoring agent
vendor: SadApp
homepage: https://sadapp.org
license: Apache-2.0
scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh
contents:
  - src: dist/.package-root/sadapp-host-agent
    dst: /usr/bin/sadapp-host-agent
    file_info:
      mode: 0755
  - src: packaging/sadapp-host-agent.service
    dst: /usr/lib/systemd/system/sadapp-host-agent.service
    file_info:
      mode: 0644
  - src: packaging/sadapp-host-agent.env
    dst: /etc/default/sadapp-host-agent
    type: config|noreplace
    file_info:
      mode: 0600
deb:
  compression: xz
rpm:
  compression: gzip